# Single-Stage Balanced Phoneme Classification Configuration
# Handles class imbalance with focal loss and optional rare phoneme grouping

data:
  data_path: "<DATA_ROOT>/libribrain/data"
  tmin: 0.0
  tmax: 0.5  # 0.5 seconds for 125 time points at 250Hz
  use_subset: false  # Set to false for full training data
  use_signal_averaging: true
  grouped_samples: 100  # Group average for better SNR
  shuffle_seed: 42  # For reproducible shuffling in GroupedDataset
  
  # Preprocessing options
  use_preprocessed: true  # Set to true to use preprocessed data (much faster)
  preprocessed_dir: "/scratch2/libribrain_processed/preprocessed_data_tmax0_5_grouped100"
  load_to_memory: true  # Load entire dataset to RAM (faster but uses more memory)

training:
  max_epochs: 50  # Single stage training
  batch_size: 64
  learning_rate: 0.0001
  num_workers: 32
  seed: 42
  devices: 1
  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  use_early_stopping: true
  early_stopping_patience: 10
  save_dir: "<MODEL_ROOT>/models/gru_network_082825v1"

logging:
  log_dir: "<DATA_ROOT>/lightning_logs"
  use_tensorboard: true
  wandb:
    project: "libribrain-phoneme-classification"
    entity: "september-labs"  # Set to your wandb entity/team name
    name: "gru_network_082825v1"  # Run name
    tags: ["phoneme", "classification", "libribrain", "balanced", "focal-loss", "single-stage"]
    notes: "One-stage LCS-CTC classifier with focal loss and optional rare phoneme handling"

model:
  # Model selection - specify module path and class name
  module: "models.architectures.gru_network"  # Module containing the model class
  class: "GRUPhonemeClassifier"                          # Class name to instantiate
  
  # Common parameters passed to all models
  params:
    # GRU architecture
    hidden_dim: 512
    n_layers: 4
    bidirectional: true
    dropout: 0.1
    
    # Session adaptation (optional)
    use_session_adaptation: true  # Enable if you want session-specific layers
    n_sessions: 90  # Estimated number of unique sessions
    
    # Preprocessing
    use_gaussian_smoothing: true
    gaussian_kernel_size: 7
    gaussian_sigma: 1.0
    
    # Input transformation
    use_input_projection: true
    input_projection_dim: 256
    input_nonlinearity: 'relu'  # 'softsign', 'relu', 'tanh', 'none'
    
    # Temporal aggregation
    aggregation: 'attention'  # 'last', 'mean', 'max', 'attention'
    
    # Data augmentation
    white_noise_std: 0.05  # Add noise during training
    constant_offset_std: 0.09  # Channel-wise offset augmentation
    
    # Output layers
    use_fc_hidden: true
    fc_hidden_dim: 1024
    
    # Training parameters
    learning_rate: 0.0001
    weight_decay: 0.01
    lr_schedule: 'cosine'  # 'none', 'step', 'cosine'
    lr_step_size: 10
    lr_gamma: 0.5

evaluation:
  # Evaluation-specific settings
  partition: "validation"  # "validation" or "test"
  batch_size: 32
  num_workers: 16
  use_signal_averaging: true
  grouped_samples: 100
  plot_results: true
  save_plots: true

submission:
  # Submission generation settings
  batch_size: 64
  num_workers: 32
  output_path: "<DATA_ROOT>/gru_network_082825v1_submission.csv"
  holdout_task: "phoneme"  # Task type for holdout dataset