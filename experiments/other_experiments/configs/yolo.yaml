# YOLO-MEG Model Configuration for LibriBrain Phoneme Classification
# This config uses the YOLO backbone adapted for MEG signal processing

data:
  data_path: "<DATA_ROOT>/libribrain/data"
  tmin: 0.0
  tmax: 0.5  # 0.5 seconds for 125 time points at 250Hz
  use_subset: false  # Set to true for quick testing with Sherlock1 only
  use_signal_averaging: true
  grouped_samples: 100  # Average 100 samples per phoneme for better SNR
  shuffle_seed: 777  # For reproducible shuffling in GroupedDataset
  
  # Preprocessing options for faster loading
  use_preprocessed: true  # Set to true to use preprocessed data
  preprocessed_dir: "./preprocessed_data_tmax0_5_grouped100"
  load_to_memory: true  # Load entire dataset to RAM if available

training:
  max_epochs: 50  # YOLO model can benefit from longer training
  batch_size: 32  # Smaller batch size due to larger model
  learning_rate: 0.0005  # Starting learning rate (will use warmup + cosine)
  weight_decay: 0.01  # L2 regularization
  num_workers: 16
  seed: 777
  devices: 1
  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 1.0  # Gradient clipping for stability
  accumulate_grad_batches: 2  # Effective batch size of 64
  use_early_stopping: true
  early_stopping_patience: 10
  use_swa: true  # Stochastic Weight Averaging for better generalization
  swa_lrs: 0.0001  # SWA learning rate
  label_smoothing: 0.1  # Label smoothing for better generalization
  save_dir: "<MODEL_ROOT>/models/ihor_yolo_meg_phoneme_092025v0"

logging:
  log_dir: "./lightning_logs"
  use_tensorboard: true
  wandb:
    project: "libribrain-phoneme-classification"
    entity: "september-labs"  # Set to your wandb entity/team name
    name: "yolo-meg-phoneme-082025v0"  # Run name
    tags: ["phoneme", "classification", "libribrain", "yolo", "meg", "multi-scale"]
    notes: "YOLO backbone adapted for MEG phoneme classification with multi-scale features and attention fusion"

model:
  # Model selection - specify module path and class name
  module: "models.architectures.yolo"  # Module containing the YOLO-MEG model
  class: "MEGYOLOPhonemeClassifier"       # Class name to instantiate
  
  # Common parameters passed to all models
  params:
    lr: 0.0001  # Learning rate (matches training.learning_rate)
    max_epochs: 50  # For warmup schedule
    
  # YOLO-MEG specific configuration
  yolo_config:
    # Architecture parameters
    input_dim: 306          # MEG sensor channels
    model_dim: 128          # Hidden dimension for LSTM and projections
    depth: 0.25              # Depth multiplier for YOLO blocks (controls number of layers)
    width: 0.25             # Width multiplier for channels (controls model width)
    
    # LSTM configuration
    lstm_layers: 2          # Number of LSTM layers per branch
    bidirectional: true     # Use bidirectional LSTMs
    share_lstm: false       # Don't share LSTM weights between scales
    pool: "mean"            # Pooling strategy: "last", "mean", or "max"
    
    # Training parameters
    dropout: 0.5            # Dropout rate for regularization
    label_smoothing: 0.1    # Label smoothing for better generalization
    weight_decay: 0.01      # L2 regularization weight
    
    # Attention fusion
    use_attention: true     # Use attention-weighted fusion of multi-scale features
    
    # Learning rate schedule
    warmup_epochs: 2        # Number of warmup epochs
    
evaluation:
  # Evaluation-specific settings
  partition: "validation"  # "validation" or "test"
  batch_size: 256          # Larger batch size for evaluation
  num_workers: 32
  use_signal_averaging: true
  grouped_samples: 100    # Match training averaging
  plot_results: true
  save_plots: true
  
submission:
  # Submission generation settings
  batch_size: 64
  num_workers: 32
  output_path: "./submissions/yolo_phoneme_081025v0.csv"
  holdout_task: "phoneme"  # Task type for holdout dataset