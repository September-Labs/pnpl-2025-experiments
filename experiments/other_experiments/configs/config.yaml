# Default configuration for phoneme classification training

data:
  data_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/libribrain/data"
  tmin: 0.0
  tmax: 0.5
  use_subset: false  # Set to false for full training data
  use_signal_averaging: true
  grouped_samples: 100
  shuffle_seed: 777  # For reproducible shuffling in GroupedDataset
  
  # Preprocessing options
  use_preprocessed: true  # Set to true to use preprocessed data (much faster)
  preprocessed_dir: "./preprocessed_data_tmax0_5_grouped100"
  load_to_memory: true  # Load entire dataset to RAM (faster but uses more memory)

training:
  max_epochs: 5
  batch_size: 64
  learning_rate: 0.001
  num_workers: 64
  seed: 777
  devices: 1
  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  use_early_stopping: false
  early_stopping_patience: 50
  save_dir: "/home/s8l/remote_storage/aleks/competitions/libribrain/models/cbramod_phoneme_081025v0"

logging:
  log_dir: "./lightning_logs"
  use_tensorboard: true
  wandb:
    project: "libribrain-phoneme-classification"
    entity: september-labs  # Set to your wandb entity/team name
    name: "cbramod_phoneme_081025v0"  # Run name, will be auto-generated if null
    tags: ["phoneme", "classification", "libribrain"]
    notes: "Phoneme classification training run"

model:
  # Model selection - specify module path and class name
  module: "models.architectures.cbramod"  # Module containing the model class
  class: "PhonemeClassificationCBraMod"      # Class name to instantiate
  
  # Common parameters passed to all models
  params:
    learning_rate: 0.001
    time_points: 250
    
  cbramod_config:
    patch_size: 25  # 10 patches × 25 = 250 time points
    num_patches: 10  # Matches input length exactly
    d_model: 256  # Balanced model size
    dim_feedforward: 1024  # 4x d_model
    n_layer: 8  # Moderate depth
    nhead: 8  # 8 attention heads
    dropout: 0.3  # Strong regularization
    
evaluation:
  # Evaluation-specific settings
  partition: "test"  # "validation" or "test"
  batch_size: 64
  num_workers: 64
  use_signal_averaging: true
  grouped_samples: 100
  plot_results: true
  save_plots: true
  
submission:
  # Submission generation settings
  batch_size: 64
  num_workers: 64
  output_path: "./cbramod_phoneme_081025v0.csv"
  holdout_task: "phoneme"  # Task type for holdout dataset