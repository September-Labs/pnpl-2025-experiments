# spd_geometric.yaml
data:
  data_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/libribrain/data"
  tmin: 0.0
  tmax: 0.5
  use_subset: false
  use_signal_averaging: true
  grouped_samples: 100  # Keep at 100 for evaluation compatibility
  shuffle_seed: 777
  
  use_preprocessed: true
  preprocessed_dir: "/scratch2/libribrain_processed/preprocessed_data_tmax0_5_grouped100"
  load_to_memory: true

training:
  max_epochs: 50
  batch_size: 32  # Smaller batch for SPD operations
  learning_rate: 0.0003
  weight_decay: 0.01
  num_workers: 16
  seed: 777
  devices: 1
  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 0.5
  accumulate_grad_batches: 2
  use_early_stopping: true
  early_stopping_patience: 15
  use_swa: false
  swa_lrs: 0.0001
  label_smoothing: 0.1  # Help with out-of-domain generalization
  save_dir: "/home/s8l/remote_storage/aleks/competitions/libribrain/models/spd_geometric_082325v0"

logging:
  log_dir: "/home/s8l/remote_storage/aleks/competitions/libribrain/models/spd_geometric_082325v0/logs"
  use_tensorboard: true
  wandb:
    project: "libribrain-phoneme-classification"
    entity: "september-labs"
    name: "spd_geometric_082325v0"
    tags: ["phoneme", "spd", "geometric", "spatial-attention", "dilated-conv"]
    notes: "SPD manifold representation with spatial attention and residual dilated convolutions for robust out-of-domain generalization"

model:
  module: "models.architectures.spd_geometric"
  class: "SPDGeometricNetwork"
  
  params:
    learning_rate: 0.0003
    weight_decay: 0.01
    n_channels: 306
    n_classes: 39
    label_smoothing: 0.1
    
  spd_geometric_config:
    # SPD configuration
    window_size: 25  # 100ms windows at 250Hz
    window_stride: 10  # 40ms stride
    eigenbasis_rank: 64  # Reduced dimension for efficiency
    
    # Architecture configuration
    hidden_dim: 256
    num_dilated_blocks: 3
    dilation_rates: [1, 2, 4, 8]
    spatial_attention_heads: 8
    dropout_rate: 0.3
    use_mixup: true
    mixup_alpha: 0.2
    
    # Manifold configuration
    use_manifold_gru: true  # Use manifold-aware GRU
    manifold_type: "spd"  # SPD manifold operations
    
evaluation:
  partition: "validation"
  batch_size: 64
  num_workers: 32
  use_signal_averaging: true
  grouped_samples: 100
  plot_results: true
  save_plots: true
  
submission:
  batch_size: 64
  num_workers: 32
  output_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/spd_geometric_082325v0_submission.csv"
  holdout_task: "phoneme"