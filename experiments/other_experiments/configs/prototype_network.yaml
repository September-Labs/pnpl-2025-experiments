# simplified_meg_classifier.yaml
# Configuration for high-performance simplified MEG phoneme classifier

data:
  data_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/libribrain/data"
  tmin: 0.0
  tmax: 0.5  # 125 time points at 250Hz
  use_subset: false
  use_signal_averaging: true
  grouped_samples: 100  # Already averaged - crucial for good performance
  shuffle_seed: 777
  
  # Preprocessing options
  use_preprocessed: true
  preprocessed_dir: "/scratch2/libribrain_processed/preprocessed_data_tmax0_5_grouped100"
  load_to_memory: true  # Load all data to memory for faster training

training:
  max_epochs: 100
  batch_size: 64  # Smaller batch for better gradients
  learning_rate: 0.002  # Higher learning rate
  weight_decay: 0.01
  label_smoothing: 0.05  # Reduced smoothing
  num_workers: 32
  seed: 42
  devices: 1
  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2  # Effective batch size of 128
  use_early_stopping: true
  early_stopping_patience: 25
  use_swa: true
  swa_lrs: 0.0001
  save_dir: "/home/s8l/remote_storage/aleks/competitions/libribrain/models/prototype_network_082325v2"

logging:
  log_dir: "/home/s8l/remote_storage/aleks/competitions/libribrain/models/prototype_network_082325v2/logs"
  use_tensorboard: true
  wandb:
    project: "libribrain-phoneme-classification"
    entity: "september-labs"
    name: "prototype_network_082325v2"
    tags: ["prototype", "network", "phoneme", "attention", "mixup"]
    notes: "Prototype network with attention and augmentation"

model:
  module: "models.architectures.prototype_network"
  class: "SimplifiedMEGClassifier"
  
  params:
    n_channels: 306
    n_classes: 39
    learning_rate: 0.002
    weight_decay: 0.01
    label_smoothing: 0.05
    
  simplified_meg_classifier_config:
    # Architecture
    hidden_dim: 512  # Larger hidden dimension for more capacity
    
    # Training schedule
    warmup_epochs: 5
    max_epochs: 100
    
    # Auxiliary tasks for better representations
    use_auxiliary: true  # Predict phoneme type and voicing
    auxiliary_weight: 0.1
    
    # Data augmentation for regularization
    use_mixup: true  # Mix samples for better generalization
    mixup_alpha: 0.2
    use_cutmix: false  # Alternative augmentation
    cutmix_alpha: 1.0
    
evaluation:
  partition: "test"
  batch_size: 128
  num_workers: 32
  use_signal_averaging: true
  grouped_samples: 100
  plot_results: true
  save_plots: true
  
submission:
  batch_size: 128
  num_workers: 32
  output_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/prototype_network_082325v2_submission.csv"
  holdout_task: "phoneme"