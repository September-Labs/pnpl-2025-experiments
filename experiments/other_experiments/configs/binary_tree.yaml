# Single-Stage Balanced Phoneme Classification Configuration
# Handles class imbalance with focal loss and optional rare phoneme grouping

data:
  data_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/libribrain/data"
  tmin: 0.0
  tmax: 0.5  # 0.5 seconds for 125 time points at 250Hz
  use_subset: false  # Set to false for full training data
  use_signal_averaging: true
  grouped_samples: 50  # Group average for better SNR
  shuffle_seed: 42  # For reproducible shuffling in GroupedDataset
  
  # Preprocessing options
  use_preprocessed: true  # Set to true to use preprocessed data (much faster)
  preprocessed_dir: "/scratch2/libribrain_processed/preprocessed_data_tmax0_5_grouped50"
  load_to_memory: true  # Load entire dataset to RAM (faster but uses more memory)

training:
  max_epochs: 50  # Single stage training
  batch_size: 128
  learning_rate: 0.0001
  num_workers: 32
  seed: 777
  devices: 1
  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  use_early_stopping: true
  early_stopping_patience: 10
  save_dir: "/home/s8l/remote_storage/aleks/competitions/libribrain/models/binary_tree_082925v2"

logging:
  log_dir: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/lightning_logs"
  use_tensorboard: true
  wandb:
    project: "libribrain-phoneme-classification"
    entity: "september-labs"  # Set to your wandb entity/team name
    name: "binary_tree_082925v2"  # Run name
    tags: ["phoneme", "classification", "libribrain", "balanced", "focal-loss", "single-stage"]
    notes: "Binary tree classifier with focal loss and optional rare phoneme handling"

model:
  # Model selection - specify module path and class name
  module: "models.architectures.binary_tree"  # Module containing the model class
  class: "HierarchicalMEGClassifier"                          # Class name to instantiate
  
  # Common parameters passed to all models
  params:
    meg_channels: 306
    time_points: 125
    vocab_size: 39
    hidden_dim: 256
    num_conformers: 2
    loss_type: "cross_entropy"
    use_class_weights: true
    temperature: 1.0
    label_smoothing: 0.1
    dropout_rate: 0.1
    weight_decay: 0.01
    warmup_epochs: 5
    total_epochs: 50

evaluation:
  # Evaluation-specific settings
  partition: "validation"  # "validation" or "test"
  batch_size: 32
  num_workers: 16
  use_signal_averaging: true
  grouped_samples: 100
  plot_results: true
  save_plots: true

submission:
  # Submission generation settings
  batch_size: 64
  num_workers: 32
  output_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/binary_tree_082925v2_submission.csv"
  holdout_task: "phoneme"  # Task type for holdout dataset