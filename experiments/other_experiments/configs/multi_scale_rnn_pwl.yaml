
# Enhanced Multi-Scale RNN MEG Phoneme Classification Configuration
# Heavily incorporates successful elements from demega architecture

data:
  data_path: "<DATA_ROOT>/libribrain/data"
  tmin: 0.0
  tmax: 0.5  # 0.5 seconds for 125 time points at 250Hz
  use_subset: false  # Set to false for full training data
  use_signal_averaging: true
  grouped_samples: 100  # Group average for better SNR
  shuffle_seed: 777  # For reproducible shuffling in GroupedDataset
  
  # Preprocessing options
  use_preprocessed: true  # Set to true to use preprocessed data (much faster)
  preprocessed_dir: "/scratch2/libribrain_processed/preprocessed_data_tmax0_5_grouped100"
  load_to_memory: true  # Load entire dataset to RAM (faster but uses more memory)

training:
  max_epochs: 30  # Following demega's configuration
  batch_size: 64  # Same as demega
  learning_rate: 0.0001  # Same as demega
  num_workers: 32
  seed: 777
  devices: 1
  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  use_early_stopping: true
  early_stopping_patience: 10  # Same as demega
  save_dir: "<MODEL_ROOT>/models/multi_scale_rnn_enhanced_090825v0"
  
  # Checkpoint settings
  checkpoint:
    monitor: "val_f1_macro"
    mode: "max"
    save_top_k: 3
    save_last: true
    verbose: true

logging:
  log_dir: "<DATA_ROOT>/lightning_logs"
  use_tensorboard: true
  log_every_n_steps: 50
  wandb:
    project: "libribrain-phoneme-classification"
    entity: "september-labs"
    name: "multi_scale_rnn_enhanced_090825v1"
    tags: ["phoneme", "classification", "libribrain", "multi-scale", "rnn", "conformer", "deberta", "focal-loss"]
    notes: "Enhanced Multi-scale RNN heavily incorporating demega's successful components"

model:
  # Model selection - specify module path and class name
  module: "models.architectures.multi_scale_rnn_pwl"
  class: "EnhancedMultiScaleRNNClassifier"
  
  # Model architecture parameters
  params:
    # Core dimensions (from demega)
    meg_channels: 306      # MEG sensor channels
    time_points: 125       # Will be overridden by script but included for clarity
    vocab_size: 39         # Number of phoneme classes
    hidden_dim: 64         # Hidden dimension size (same as demega)
    # pla_method: "ramer_douglas_peucker"  # Piecewise linear approx method
    
    # Multi-scale temporal features
    temporal_scales: [8, 16, 32, 64]  # Different temporal window sizes
    scale_hidden_dims: [32, 48, 64, 80]  # Hidden dims for each scale
    num_conformer_layers: 2  # Number of Conformer layers per scale
    
    # Architecture choices (from demega)
    use_conformer: true    # Use Conformer layers (key to demega's success)
    norm_type: "pre"       # Pre-layer normalization (from demega)
    
    # Training parameters (from demega)
    learning_rate: 0.0001  # Base learning rate
    classifier_lr_multiplier: 2.0  # Classifier learns faster (from demega)
    
    # Loss configuration (from demega)
    loss_type: "focal"     # Use focal loss for class imbalance
    focal_gamma: 2.0       # Focal loss gamma parameter (from demega)
    temperature: 2.0       # Temperature for class reweighting (from demega)
    
    # Regularization (from demega)
    dropout_rate: 0.1      # Dropout rate (from demega)
    label_smoothing: 0.1   # Label smoothing (from demega)
    weight_decay: 0.01     # L2 regularization (from demega)
    
    # Learning rate schedule (from demega)
    warmup_epochs: 5       # Linear warmup epochs (from demega)
    total_epochs: 100      # Total epochs for cosine schedule (from demega)
    
    # Data augmentation
    use_augmentation: true
    augmentation_params:
      noise_level: 0.05       # Gaussian noise std
      time_jitter: 0.02       # Time jitter range
      channel_dropout: 0.1    # Random channel dropout probability
      time_masking: 0.1       # Time masking probability
      mixup_alpha: 0.2        # Mixup augmentation strength
    
    # Scale weighting mechanism
    scale_weighting: "attention"  # Dynamic attention-based weighting
    scale_attention_dim: 64       # Dimension for scale attention

evaluation:
  # Evaluation-specific settings
  partition: "test"  # "validation" or "test"
  batch_size: 64
  num_workers: 16
  use_signal_averaging: true
  grouped_samples: 100  # More averaging for cleaner evaluation
  plot_results: true
  save_plots: true

submission:
  # Submission generation settings
  batch_size: 64
  num_workers: 32
  output_path: "<DATA_ROOT>/submissions/multi_scale_rnn_enhanced_090825v1_submission.csv"
  holdout_task: "phoneme"  # Task type for holdout dataset

