data:
  data_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/libribrain/data"
  tmin: 0.0
  tmax: 0.5  # 0.5 seconds for 125 time points at 250Hz
  use_subset: false  # Set to false for full training data
  use_signal_averaging: true
  grouped_samples: 100
  shuffle_seed: 777  # For reproducible shuffling in GroupedDataset

  # Preprocessing options
  use_preprocessed: true  # Set to true to use preprocessed data (much faster)
  preprocessed_dir: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/preprocessed_data_tmax0_5_grouped100"
  load_to_memory: true  # Load entire dataset to RAM (faster but uses more memory)

training:
  max_epochs: 50
  batch_size: 128
  learning_rate: 0.0001
  num_workers: 64
  seed: 777
  devices: 1
  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1  # Effective batch size of 16
  use_early_stopping: true
  early_stopping_patience: 20
  label_smoothing: 0.01 
  save_dir: "/home/s8l/remote_storage/aleks/competitions/libribrain/models/danet_simple_081425v1"

logging:
  log_dir: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/lightning_logs"
  use_tensorboard: true
  wandb:
    project: "libribrain-phoneme-classification"
    entity: september-labs  # Set to your wandb entity/team name
    name: "danet_simple_081425v1"  # Run name
    tags: ["phoneme", "classification", "libribrain", "danet", "simple"]
    notes: "DAnet-Simple model for phoneme classification"

model:
  # Model selection
  module: "models.architectures.danet_simple"  # Path to your model file
  class: "SimpleDAnetPhonemeClassifier"
  
  # Common parameters
  params:
    learning_rate: 0.0001  # For classifier only
    
  # DAnet-specific configuration
  danet_simple_config:
    # DAnet architecture
    n_components: 8              # Number of decomposition components
    n_selected_channels: 30      # Number of MEG channels to use
    danet_kernel_size: 125       # Kernel size for DAnet (matches time points)
    
    # Pre-training management
    danet_pretrained_dir: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/checkpoints/danet"
    danet_pretrain_epochs: 10    # Epochs for unsupervised pre-training
    danet_pretrain_batch_size: 128  # Batch size for pre-training
    force_retrain_danet: true   # Set to true to force re-training even if weights exist
    
    # Training configuration
    freeze_danet: false           # Freeze DAnet after loading/pre-training
    dropout: 0.2                  # Dropout in classifier
    
    # Data paths for automatic pre-training (uses same as main data config)
    data_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/preprocessed_data_tmax0_5_grouped100"
    data_tmin: 0.0
    data_tmax: 0.5
    
    # These are inherited from data if needed
    meg_channels: 306
    vocab_size: 39

evaluation:
  # Evaluation-specific settings
  partition: "test"  # "validation" or "test"
  batch_size: 64
  num_workers: 64
  use_signal_averaging: true
  grouped_samples: 100
  plot_results: true
  save_plots: true

submission:
  # Submission generation settings
  batch_size: 64
  num_workers: 64
  output_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/danet_simple_081425v1_submission.csv"
  holdout_task: "phoneme"  # Task type for holdout dataset