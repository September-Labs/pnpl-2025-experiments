# config_stgm_balanced.yaml
data:
  data_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/libribrain/data"
  tmin: 0.0
  tmax: 0.5
  use_subset: false
  use_signal_averaging: true
  grouped_samples: 100  # Consider reducing to 50 for rare phonemes
  shuffle_seed: 42
  
  use_preprocessed: true
  preprocessed_dir: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/preprocessed_data_tmax0_5_grouped100"
  load_to_memory: true

training:
  max_epochs: 500  # Increase epochs for rare phonemes to be seen more
  batch_size: 128    # Increase batch size to see more diversity
  learning_rate: 0.00001  # Lower LR for stability with weighted loss
  num_workers: 32
  seed: 42
  devices: 1
  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2  # Effectively batch size 64
  use_early_stopping: false
  early_stopping_patience: 25  # More patience
  save_dir: "/home/s8l/remote_storage/aleks/competitions/libribrain/models/stgm_balanced_081625v0"

logging:
  log_dir: "./lightning_logs"
  use_tensorboard: true
  wandb:
    project: "libribrain-phoneme-classification"
    entity: "september-labs"
    name: "stgm_balanced_081625v0"
    tags: ["phoneme", "stgm", "balanced", "focal-loss", "rare-aware"]
    notes: "STGM with focal loss and rare phoneme awareness"

model:
  module: "models.architectures.stgm"
  class: "STGMBalanced"
  
  params:
    learning_rate: 0.00001
    
  stgm_config:
    meg_channels: 306
    vocab_size: 39
    hidden_dim: 256
    coord_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/libribrain/data/sensor_xyz.json"
    k_neighbors: 8  # Increase for better spatial coverage
    use_spatial_attention: true
    n_brain_regions: 4  # More regions for finer spatial discrimination
    
    # Mamba config
    mamba_d_state: 32  # Increase for more complex patterns
    mamba_d_conv: 16
    mamba_expand: 8
    
    # Training config
    dropout: 0.3  # More dropout to prevent overfitting on common classes
    weight_decay: 0.001
    label_smoothing: 0.0  # Less smoothing to preserve rare class signals
    
    # Class balancing
    use_focal_loss: true
    focal_gamma: 3.0  # Focus on hard examples
    focal_alpha: null  # Will be computed from class frequencies
    
    # Use precomputed weights
    use_class_weights: true
    weight_type: "effective_num"  # Best for extreme imbalance
    weights_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/phoneme_weights/phoneme_weights.json"
    
    # Rare phoneme handling
    rare_threshold: 200  # Phonemes with < 100 samples are "rare"
    rare_boost_factor: 5.0  # Extra weight for rare phonemes
    use_mixup: true  # Data augmentation
    mixup_alpha: 0.5
    
    # Hierarchical classification
    use_hierarchical: true
    phoneme_groups: {
      "vowels": [0, 1, 2, 3, 4, 5, 10, 11, 12, 16, 17, 24, 25, 32, 33],
      "stops": [6, 8, 14, 19, 26, 30],
      "fricatives": [13, 15, 28, 29, 31, 37, 38],
      "nasals": [21, 22, 23],
      "liquids": [20, 27],
      "affricates": [7, 18],
      "glides": [35, 36],
      "voiced_th": [9],
      "voiceless_th": [31],
      "others": [34]
    }
    
    use_scheduler: true
    scheduler_patience: 10

evaluation:
  partition: "test"
  batch_size: 64
  num_workers: 8
  use_signal_averaging: true
  grouped_samples: 100
  plot_results: true
  save_plots: true

submission:
  batch_size: 64
  num_workers: 8
  output_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/stgm_081625v0_submission.csv"
  holdout_task: "phoneme"