# memory_retrieval.yaml
data:
  data_path: "<DATA_ROOT>/libribrain/data"
  tmin: 0.0
  tmax: 0.5  # 0.5 seconds for 125 time points at 250Hz
  use_subset: false
  use_signal_averaging: true
  grouped_samples: 100
  shuffle_seed: 777
  
  # Preprocessing options
  use_preprocessed: true
  preprocessed_dir: "/scratch2/libribrain_processed/preprocessed_data_tmax0_5_grouped100"
  load_to_memory: true

training:
  max_epochs: 50  # Reduced from 100 - should converge faster
  batch_size: 64  # Reduced for better gradient quality with memory bank
  learning_rate: 0.001  # Increased 100x - new architecture learns faster
  weight_decay: 0.01
  label_smoothing: 0.1  # Added smoothing for better generalization
  num_workers: 32
  seed: 42
  devices: 1
  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1  # Reduced from 2
  use_early_stopping: true
  early_stopping_patience: 15
  use_swa: false
  save_dir: "<MODEL_ROOT>/models/symbol_grounding_082325v0"

logging:
  log_dir: "<MODEL_ROOT>/models/symbol_grounding_082325v0/logs"
  use_tensorboard: true
  wandb:
    project: "libribrain-symbols"
    entity: "september-labs"
    name: "symbol_grounding_082325v0"
    tags: ["memory", "retrieval", "hierarchical", "contrastive", "meg", "libribrain"]
    notes: "Memory-augmented retrieval network with hierarchical decoding and contrastive learning"

model:
  module: "models.architectures.symbol_grounding"
  class: "MemoryRetrievalWordNetwork"
  
  params:
    learning_rate: 0.001
    weight_decay: 0.01
    n_channels: 306
    n_classes: 39  # Required by interface but not used
    label_smoothing: 0.1
    
  memory_retrieval_config:
    vocab_size: 1000  # Vocabulary size for word assignments
    meg_encoding_dim: 256  # Dimension of MEG encoding
    num_memories: 500  # Number of memory slots in memory bank
    num_patterns: 500  # Number of unique word assignment patterns
    use_contrastive: true  # Enable contrastive learning
    contrastive_weight: 0.2  # Weight for contrastive loss
    
evaluation:
  partition: "validation"
  batch_size: 64
  num_workers: 32
  use_signal_averaging: true
  grouped_samples: 100
  plot_results: true
  save_plots: true
  
submission:
  batch_size: 64
  num_workers: 32
  output_path: "<PROJECT_ROOT>/track_2_phoneme_classification/symbol_grounding_082325v0_submission.csv"
  holdout_task: "phoneme"