# separate_phoneme_models.yaml
data:
  data_path: "<DATA_ROOT>/libribrain/data"
  tmin: 0.0
  tmax: 0.5
  use_subset: false
  use_signal_averaging: true
  grouped_samples: 10
  shuffle_seed: 777
  use_preprocessed: true
  preprocessed_dir: "/scratch2/libribrain_processed/preprocessed_data_tmax0_5_grouped100"
  load_to_memory: true

training:
  max_epochs: 50  # More epochs for rare phonemes
  batch_size: 256  # Larger batches since models are smaller
  learning_rate: 0.001
  weight_decay: 0.01
  label_smoothing: 0.0
  num_workers: 16
  seed: 777
  devices: 1
  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  use_early_stopping: true
  early_stopping_patience: 15  # More patience for rare phonemes
  use_swa: false  # Disable for individual models
  save_dir: "<MODEL_ROOT>/models/little_classifiers_082325v0"

logging:
  log_dir: "<MODEL_ROOT>/models/little_classifiers_082325v0/logs"
  use_tensorboard: true
  wandb:
    project: "libribrain-phoneme-classification"
    entity: "september-labs"
    name: "little_classifiers_082325v0"
    tags: ["phoneme", "classification", "libribrain", "separate-models", "custom-balance"]
    notes: "39 separate binary models with custom balancing per phoneme frequency"

model:
  module: "models.architectures.little_classifiers"
  class: "PhonemeModelManager"
  
  params:
    learning_rate: 0.001
    weight_decay: 0.01
    label_smoothing: 0.0
    
  separate_phoneme_models_config:
    n_channels: 306
    n_classes: 39
    current_phoneme: 0  # Will be set by training script

evaluation:
  partition: "validation"
  batch_size: 256
  num_workers: 32
  use_signal_averaging: true
  grouped_samples: 100
  plot_results: true
  save_plots: true
  
submission:
  batch_size: 256
  num_workers: 32
  output_path: "<PROJECT_ROOT>/track_2_phoneme_classification/little_classifiers_082325v0_submission.csv"
  holdout_task: "phoneme"