# Outer Loop Transformer Configuration for LibriBrain Phoneme Classification
# Based on HRM paper: iterative refinement with deep supervision and ACT

data:
  data_path: "<DATA_ROOT>/libribrain/data"
  tmin: 0.0
  tmax: 0.5  # 0.5 seconds = 125 time points at 250Hz
  use_subset: false  # Set to true for quick testing with subset
  use_signal_averaging: true
  grouped_samples: 100  # Signal averaging for better SNR
  shuffle_seed: 42
  
  # Preprocessing options
  use_preprocessed: true  # Set to true if you have preprocessed data
  preprocessed_dir: "/scratch2/libribrain_processed/preprocessed_data_tmax0_5_grouped100"
  load_to_memory: false  # Load entire dataset to RAM if true

training:
  max_epochs: 50
  batch_size: 16
  learning_rate: 0.001
  num_workers: 4
  seed: 42
  devices: 1
  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2  # Effective batch size = 32
  use_early_stopping: true
  early_stopping_patience: 10
  save_dir: "<MODEL_ROOT>/models/outer_loop_082125v0"
  
  # Stochastic Weight Averaging
  use_swa: true
  swa_lrs: 0.0001
  
  # Label smoothing
  label_smoothing: 0.1

logging:
  log_dir: "<MODEL_ROOT>/models/outer_loop_082125v0/logs"
  use_tensorboard: true
  wandb:
    project: "libribrain-phoneme-classification"
    entity: "september-labs"  # Replace with your wandb entity
    name: "outer_loop_082125v0"
    tags: ["phoneme", "classification", "outer-loop", "hrm", "act", "deep-supervision"]
    notes: "Outer Loop Transformer with iterative refinement, ACT, and deep supervision based on HRM findings"

model:
  # Model selection
  module: "models.architectures.outer_limits"
  class: "OuterLoopTransformer"
  
  # Common parameters passed to all models
  params:
    learning_rate: 0.001
    weight_decay: 0.01
    
  # Model-specific configuration
  outer_loop_transformer_config:
    # Architecture parameters
    n_channels: 306        # MEG sensor channels
    n_classes: 39          # Number of phoneme classes
    d_model: 256           # Transformer hidden dimension
    n_heads: 8             # Number of attention heads
    n_layers: 4            # Number of transformer layers
    ff_dim_multiplier: 4   # Feed-forward dimension multiplier
    dropout: 0.1           # Dropout rate
    
    # Outer loop parameters (key innovation from HRM)
    max_segments: 8        # Maximum refinement iterations
    min_segments: 2        # Minimum iterations before allowing halt
    segment_penalty: 0.01  # Cost per segment to encourage efficiency
    
    # Adaptive Computation Time (ACT) parameters
    use_act: true          # Enable adaptive halting
    act_loss_weight: 0.1   # Weight for ACT loss component
    epsilon_start: 0.2     # Initial exploration rate
    epsilon_end: 0.01      # Final exploration rate
    epsilon_decay: 0.95    # Epsilon decay per epoch
    
    # Deep supervision parameters
    deep_supervision: true           # Train with loss at each segment
    deep_supervision_weight: 0.3     # Weight for deep supervision loss
    
    # Training schedule
    warmup_epochs: 5       # Warmup period for learning rate
    max_epochs: 50         # For scheduler calculations
    
    # Inference parameters
    inference_segments_multiplier: 1.5  # Increase max_segments at test time

evaluation:
  # Evaluation-specific settings
  partition: "validation"  # "validation" or "test"
  batch_size: 32
  num_workers: 8
  use_signal_averaging: true
  grouped_samples: 100  # Match competition evaluation setup
  plot_results: true
  save_plots: true
  
  # Inference-time scaling experiments
  test_segment_multipliers: [0.5, 1.0, 1.5, 2.0]  # Test different max_segments

submission:
  # Submission generation settings
  batch_size: 32
  num_workers: 8
  output_path: "<PROJECT_ROOT>/track_2_phoneme_classification/outer_loop_082125v0_submission.csv"
  holdout_task: "phoneme"
  
  # Use best checkpoint
  checkpoint_path: null  # Will be filled automatically with best checkpoint
  
  # Inference configuration for submission
  max_segments_override: 12  # Override max_segments for submission
  use_test_time_augmentation: false  # TTA not implemented in base model
