# Configuration for MEG Spatial Graph Neural Network
# This model treats MEG sensors as nodes in a spatial graph

data:
  data_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/libribrain/data"
  tmin: 0.0
  tmax: 0.5  # 0.5 seconds for 125 time points at 250Hz
  use_subset: false  # Set to false for full training data
  use_signal_averaging: true
  grouped_samples: 100
  shuffle_seed: 42
  
  # Preprocessing options
  use_preprocessed: true
  preprocessed_dir: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/preprocessed_data_tmax0_5_grouped100"
  load_to_memory: true

training:
  max_epochs: 30
  batch_size: 64
  learning_rate: 0.0001
  num_workers: 32
  seed: 42
  devices: 1
  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  use_early_stopping: false
  early_stopping_patience: 7
  label_smoothing: 0.05
  save_dir: "/home/s8l/remote_storage/aleks/competitions/libribrain/models/spatial_gnn_081625v0"
  use_swa: true
  swa_lrs: 0.00001

logging:
  log_dir: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/lightning_logs"
  use_tensorboard: true
  wandb:
    project: "libribrain-phoneme-classification-v2"
    entity: "september-labs"
    name: "spatial_gnn_081625v0"
    tags: ["phoneme", "classification", "libribrain", "spatial", "gnn"]
    notes: "Spatial Graph Neural Network treating MEG sensors as graph nodes"

model:
  # Model selection
  module: "models.architectures.spatial_gnn"  # Save the model code in this path
  class: "MEGSpatialGNN"
  
  # Common parameters
  params:
    learning_rate: 0.0001
    
  # Spatial GNN specific configuration
  spatial_gnn_config:
    meg_channels: 306              # MEG sensor channels
    vocab_size: 39                 # Number of phoneme classes
    hidden_dim: 256                # Hidden dimension for node features
    num_graph_blocks: 3            # Number of graph convolution blocks
    num_heads: 8                   # Number of attention heads
    k_neighbors: 20                # Number of neighbors in adjacency matrix
    weight_decay: 0.01             # Weight decay for AdamW
    dropout: 0.1                   # Dropout rate
    
    # Architecture options
    use_graph_conv: true           # Use graph convolution layers
    use_spatial_attention: true    # Use spatial attention mechanism
    temporal_pooling: "attention"  # Options: "mean", "max", "attention"
    magnetometer_gradiometer_split: true  # Process mag/grad separately
    use_learnable_adjacency: false # Learn adjacency matrix weights
    
evaluation:
  partition: "test"
  batch_size: 64
  num_workers: 32
  use_signal_averaging: true
  grouped_samples: 100
  plot_results: true
  save_plots: true
  
submission:
  batch_size: 64
  num_workers: 32
  output_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/spatial_gnn_081625v0_submission.csv"
  holdout_task: "phoneme"