# meta/configs/hierarchical_binary.yaml

# Hierarchical Binary Tree Configuration for Phoneme Classification
# Uses balanced binary splits to handle severe class imbalance

data:
  data_path: "<DATA_ROOT>/libribrain/data"
  tmin: 0.0
  tmax: 0.5  # 125 time points at 250Hz
  use_subset: false  # Use full training data
  use_signal_averaging: true
  grouped_samples: 100  # Match evaluation setting
  shuffle_seed: 777
  
  # Preprocessing options
  use_preprocessed: true
  preprocessed_dir: "/scratch2/libribrain_processed/preprocessed_data_tmax0_5_grouped100"
  load_to_memory: true

training:
  max_epochs: 150  # More epochs for hierarchical learning
  batch_size: 32  # Smaller batch size for better gradient updates
  learning_rate: 0.0001  # Will be scaled per node depth
  num_workers: 32
  seed: 777
  devices: 1
  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2  # Effective batch size of 64
  use_early_stopping: true
  early_stopping_patience: 30
  use_swa: false
  swa_lrs: 0.0005
  save_dir: "<MODEL_ROOT>/models/hierarchical_binary_v1_083125v1"

logging:
  log_dir: "<DATA_ROOT>/lightning_logs"
  use_tensorboard: true
  wandb:
    project: "libribrain-phoneme-hierarchical"
    entity: "september-labs"
    name: "hierarchical_binary_v1_083125v1"
    tags: ["phoneme", "hierarchical", "binary-tree", "balanced", "rope"]
    notes: "Hierarchical binary tree with balanced splits and RoPE attention"

model:
  # Model selection - hierarchical binary classifier
  module: "models.architectures.hierarchical_binary_v1"
  class: "HierarchicalBinaryClassifier"
  
  # Common parameters
  params:
    meg_channels: 306
    vocab_size: 39
    learning_rate: 0.0001
    use_lightweight_deep: true  # Use lighter models for deep nodes
    use_transformer_deep: true  # Disable transformer for very deep nodes
    max_depth: 20  # Maximum tree depth
    label_smoothing: 0.05  # Some smoothing to prevent overconfidence

evaluation:
  partition: "test"
  batch_size: 32
  num_workers: 16
  use_signal_averaging: true
  grouped_samples: 100
  plot_results: true
  save_plots: true

submission:
  batch_size: 64
  num_workers: 32
  output_path: "<DATA_ROOT>/hierarchical_binary_083125v1_submission.csv"
  holdout_task: "phoneme"