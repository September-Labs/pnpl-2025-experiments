# GRU-RNN Speech Decoder Configuration
# Based on Kunz et al. 2025 architecture with 5-layer stacked GRU and CTC loss

data:
  data_path: "<DATA_ROOT>/libribrain/data"
  tmin: 0.0
  tmax: 0.5  # 0.5 seconds for 125 time points at 250Hz
  use_subset: false  # Set to false for full training data
  use_signal_averaging: true
  grouped_samples: 100  # Group average for better SNR
  shuffle_seed: 42  # For reproducible shuffling in GroupedDataset
  
  # Preprocessing options
  use_preprocessed: true  # Set to true to use preprocessed data (much faster)
  preprocessed_dir: "/scratch2/libribrain_processed/preprocessed_data_tmax0_5_grouped100"
  load_to_memory: true  # Load entire dataset to RAM (faster but uses more memory)

training:
  max_epochs: 100
  batch_size: 64  # Smaller batch size for RNN memory efficiency
  learning_rate: 0.001  # Higher learning rate typical for RNNs
  num_workers: 32
  seed: 777
  devices: 1
  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 5.0  # Higher gradient clipping for RNNs
  accumulate_grad_batches: 2  # Effective batch size of 128
  use_early_stopping: true
  early_stopping_patience: 20
  save_dir: "<MODEL_ROOT>/models/willet_network_090325v0"
  use_swa: false  # Typically not used with RNNs
  label_smoothing: 0.0  # Not used with CTC loss

logging:
  log_dir: "<DATA_ROOT>/lightning_logs"
  use_tensorboard: true
  wandb:
    project: "libribrain-phoneme-classification"
    entity: "september-labs"  # Set to your wandb entity/team name
    name: "willet_network_090325v0"  # Run name
    tags: ["phoneme", "gru", "rnn", "ctc", "libribrain", "speech-decoder"]
    notes: "5-layer stacked bidirectional GRU with CTC loss, based on Kunz et al. 2025"

model:
  # Model selection - specify module path and class name
  module: "models.architectures.willet_network"  # Module containing the GRU model class
  class: "SingleStageMEGClassifier"  # Class name to instantiate (kept same name)
  
  # Common parameters passed to the model
  params:
    meg_channels: 306      # MEG sensor channels (or 128 for neural features: 64 threshold crossings + 64 spike band power)
    vocab_size: 39         # Number of phoneme classes (CTC will add blank token internally)
    hidden_dim: 256        # Hidden dimension for GRU layers (as in paper)
    num_conformers: 5      # Reused as num_gru_layers (5 stacked GRU layers as in paper)
    learning_rate: 0.001   # Learning rate for AdamW optimizer
    use_conformer: false   # Will use GRU regardless of this setting
    
    # Loss configuration
    loss_type: "ctc"       # CTC loss for sequence-to-sequence without timing labels
    focal_gamma: 2.0       # Not used with CTC, kept for compatibility
    
    # Regularization
    dropout_rate: 0.3      # Dropout rate between GRU layers
    label_smoothing: 0.0   # Not applicable with CTC loss
    weight_decay: 0.0001   # L2 regularization
    
    # Multi-dataset support (for handling multiple recording sessions)
    add_noise: true        # Add artificial noise for regularization (as in paper)
    
    # Learning rate schedule
    classifier_lr_multiplier: 1.0  # Keep same LR for all layers
    warmup_epochs: 5       # Linear warmup for learning rate
    total_epochs: 100      # Total epochs for cosine annealing

evaluation:
  # Evaluation-specific settings
  partition: "validation"  # "validation" or "test"
  batch_size: 32
  num_workers: 16
  use_signal_averaging: true
  grouped_samples: 100
  plot_results: true
  save_plots: true

submission:
  # Submission generation settings
  batch_size: 64
  num_workers: 32
  output_path: "<DATA_ROOT>/willet_network_090325v0_submission.csv"
  holdout_task: "phoneme"  # Task type for holdout dataset