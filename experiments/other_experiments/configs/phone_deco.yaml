# Two-Stage LCS-CTC Configuration
# Stage 1: Balanced pre-training for class imbalance
# Stage 2: LCS-CTC with progressive constraints

data:
  data_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/libribrain/data"
  tmin: 0.0
  tmax: 0.5  # 0.5 seconds for 125 time points at 250Hz
  use_subset: false  # Set to false for full training data
  use_signal_averaging: true
  grouped_samples: 100  # Group average for better SNR
  shuffle_seed: 42  # For reproducible shuffling in GroupedDataset
  
  # Preprocessing options
  use_preprocessed: true  # Set to true to use preprocessed data (much faster)
  preprocessed_dir: "/scratch2/libribrain_processed/preprocessed_data_tmax0_5_grouped100"
  load_to_memory: false  # Load entire dataset to RAM (faster but uses more memory)

training:
  max_epochs: 50
  batch_size: 64
  learning_rate: 0.0001
  num_workers: 32
  seed: 42
  devices: 1
  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  use_early_stopping: true
  early_stopping_patience: 10
  save_dir: "/home/s8l/remote_storage/aleks/competitions/libribrain/models/phone_deco_082525v0"

logging:
  log_dir: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/lightning_logs"
  use_tensorboard: true
  wandb:
    project: "libribrain-phoneme-classification"
    entity: "september-labs"  # Set to your wandb entity/team name
    name: "phone_deco_082525v0"  # Run name
    tags: ["phoneme", "classification", "libribrain", "phone_deco"]
    notes: "Phone Decoder: Phonetic Feature Model"

model:
  module: "models.architectures.phone_deco"
  class: "PhoneticFeatureModel"
  
  params:
    meg_channels: 306
    time_points: 125
    hidden_dim: 256
    num_lstm_layers: 2
    learning_rate: 0.0001
    dropout_rate: 0.2
    
evaluation:
  # Evaluation-specific settings
  partition: "test"  # "validation" or "test"
  batch_size: 32
  num_workers: 16
  use_signal_averaging: true
  grouped_samples: 100
  plot_results: true
  save_plots: true
  
submission:
  # Submission generation settings
  batch_size: 64
  num_workers: 32
  output_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/phone_deco_082525v0_submission.csv"
  holdout_task: "phoneme"  # Task type for holdout dataset