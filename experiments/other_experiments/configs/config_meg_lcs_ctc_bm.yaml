# Configuration for MEG LCS-CTC model training

data:
  data_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/libribrain/data"
  tmin: 0.0
  tmax: 0.5  # 0.5 seconds for 125 time points at 250Hz
  use_subset: false  # Set to false for full training data
  use_signal_averaging: true
  grouped_samples: 100
  shuffle_seed: 777  # For reproducible shuffling in GroupedDataset
  
  # Preprocessing options
  use_preprocessed: true  # Set to true to use preprocessed data (much faster)
  preprocessed_dir: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/preprocessed_data_tmax0_5_grouped100"
  load_to_memory: true  # Load entire dataset to RAM (faster but uses more memory)

training:
  max_epochs: 100
  batch_size: 64 # from 16
  learning_rate: 0.0001
  num_workers: 64
  seed: 777
  devices: 1
  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 2.0
  accumulate_grad_batches: 1  # Effective batch size of 16
  use_early_stopping: false
  early_stopping_patience: 20
  label_smoothing: 0.2 
  use_swa: true #Stochastic Weight Averaging (SWA)
  swa_lrs: 0.001
  save_dir: "/home/s8l/remote_storage/aleks/competitions/libribrain/models/bm_meg_lcs_ctc_081225v1_swa_no_er"

logging:
  log_dir: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/lightning_logs"
  use_tensorboard: true
  wandb:
    project: "libribrain-phoneme-classification"
    entity: september-labs  # Set to your wandb entity/team name
    name: "bm_meg_lcs_ctc_081225v1_swa_no_er"  # Run name
    tags: ["phoneme", "classification", "libribrain", "lcs-ctc", "conformer"]
    notes: "MEG LCS-CTC model with Conformer layers for phoneme classification"

model:
  # Model selection - specify module path and class name
  module: "models.architectures.meg_lcs_ctc"  # Module containing the model class
  class: "MEGLCSCTC"                          # Class name to instantiate
  
  # Common parameters passed to all models
  params:
    learning_rate: 0.0001
    
  meg_lcs_ctc_config:
    meg_channels: 306      # MEG sensor channels
    vocab_size: 39         # Number of phoneme classes
    hidden_dim: 256        # Hidden dimension size
    num_conformers: 4      # Number of Conformer layers
    use_alignment: false    # Use alignment learning with CTC
    zipf_weights: true     # Use Zipf weights
    zipf_alpha: 0.99       # Zipf alpha parameter
    zipf_boost_factor: 0.3 # Zipf boost factor
    
evaluation:
  # Evaluation-specific settings
  partition: "test"  # "validation" or "test"
  batch_size: 32
  num_workers: 64
  use_signal_averaging: true
  grouped_samples: 100
  plot_results: true
  save_plots: true
  
submission:
  # Submission generation settings
  batch_size: 32
  num_workers: 64
  output_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/meg_lcs_ctc_081225v1_submission.csv"
  holdout_task: "phoneme"  # Task type for holdout dataset
