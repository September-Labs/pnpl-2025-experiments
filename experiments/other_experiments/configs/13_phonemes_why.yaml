  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  use_early_stopping: true
  early_stopping_patience: 15
  save_dir: "/home/s8l/remote_storage/aleks/competitions/libribrain/models/phoneme_specialist_test_082025v1"
  use_swa: true
  swa_lrs: 0.0001

logging:
  log_dir: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/lightning_logs"
  use_tensorboard: true
  wandb:
    project: "libribrain-phoneme-specialist"
    entity: "september-labs"
    name: "phoneme_specialist_test_082025v1"
    tags: ["phoneme", "specialist", "test", "082025v1"]
    notes: "Testing phoneme specialist with heavy augmentation"

model:
  module: "models.architectures.13_phonemes_why"
  class: "StrugglingPhonemeSpecialist"
  
