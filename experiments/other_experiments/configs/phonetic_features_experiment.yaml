# Phonetic Feature Decomposition Model Configuration
# Tests the hypothesis: 8 articulatory features > 39 direct phoneme classes

data:
  data_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/libribrain/data"
  tmin: 0.0
  tmax: 0.5  # 125 time points at 250Hz
  use_subset: false  # Use full training data
  use_signal_averaging: true
  grouped_samples: 100  # Standard averaging
  shuffle_seed: 42
  
  # Preprocessing options
  use_preprocessed: true
  preprocessed_dir: "/scratch2/libribrain_processed/preprocessed_data_tmax0_5_grouped100"
  load_to_memory: false

training:
  max_epochs: 50  # Enough to see convergence patterns
  batch_size: 64
  learning_rate: 0.0001
  num_workers: 32
  seed: 42
  devices: 1
  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  use_early_stopping: true
  early_stopping_patience: 10
  save_dir: "/home/s8l/remote_storage/aleks/competitions/libribrain/models/phonetic_features_experiment_082525v2"
  label_smoothing: 0.05  # Mild smoothing for feature learning
  use_swa: false

logging:
  log_dir: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/lightning_logs"
  use_tensorboard: true
  wandb:
    project: "libribrain-phoneme-decomposition"
    entity: "september-labs"
    name: "phonetic_features_experiment_082525v2"
    tags: ["phoneme", "features", "linguistic", "experimental", "ch-jh-sh-zh"]
    notes: "Testing if phone decomposition beats direct classification. Focus on CH/JH/SH/ZH clustering."

model:
  # Model selection
  module: "models.architectures.phonetic_features_experiment"
  class: "PhoneticFeatureExperiment"
  
  # Model parameters
  params:
    meg_channels: 306
    vocab_size: 39
    hidden_dim: 256
    num_conformers: 4
    learning_rate: 0.0001
    
    # EXPERIMENTAL TOGGLE
    use_features: true  # TRUE = phonetic features, FALSE = direct classification
    
    # Logging parameters
    log_every_n_steps: 10
    save_confusion_every_n_epochs: 5
    
    # Regularization
    dropout_rate: 0.2
    label_smoothing: 0.05
    
evaluation:
  partition: "test"
  batch_size: 32
  num_workers: 16
  use_signal_averaging: true
  grouped_samples: 100
  plot_results: true
  save_plots: true
  
submission:
  batch_size: 64
  num_workers: 32
  output_path: "/home/s8l/aleks/competitions/libribrain/track_2_phoneme_classification/LibriBrain_Competition/track_2_phoneme_classification/phonetic_features_experiment_082525v2_submission.csv"
  holdout_task: "phoneme"