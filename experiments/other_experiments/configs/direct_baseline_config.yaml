# Direct Classification Baseline Configuration
# Control experiment: Standard 39-way classification without phonetic features

data:
  data_path: "<DATA_ROOT>/libribrain/data"
  tmin: 0.0
  tmax: 0.5  # 125 time points at 250Hz
  use_subset: false  # Use full training data
  use_signal_averaging: true
  grouped_samples: 100  # Standard averaging
  shuffle_seed: 42
  
  # Preprocessing options
  use_preprocessed: true
  preprocessed_dir: "/scratch2/libribrain_processed/preprocessed_data_tmax0_5_grouped100"
  load_to_memory: true

training:
  max_epochs: 50  # Same as feature model for fair comparison
  batch_size: 64
  learning_rate: 0.0001
  num_workers: 32
  seed: 42
  devices: 1
  accelerator: "gpu"
  strategy: "auto"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  use_early_stopping: true
  early_stopping_patience: 10
  save_dir: "<MODEL_ROOT>/models/direct_baseline_experiment_082525v0"
  label_smoothing: 0.05  # Same smoothing for fair comparison
  use_swa: false

logging:
  log_dir: "<DATA_ROOT>/lightning_logs"
  use_tensorboard: true
  wandb:
    project: "libribrain-phoneme-decomposition"
    entity: "september-labs"
    name: "direct_baseline_experiment_082525v0"
    tags: ["phoneme", "baseline", "direct", "experimental", "control"]
    notes: "Baseline direct 39-way classification for comparison with phone decomposition."

model:
  # Model selection
  module: "models.architectures.phonetic_features_experiment"
  class: "PhoneticFeatureExperiment"
  
  # Model parameters
  params:
    meg_channels: 306
    vocab_size: 39
    hidden_dim: 256
    num_conformers: 4
    learning_rate: 0.0001
    
    # EXPERIMENTAL TOGGLE
    use_features: false  # FALSE = direct classification (baseline)
    
    # Logging parameters
    log_every_n_steps: 10
    save_confusion_every_n_epochs: 5
    
    # Regularization
    dropout_rate: 0.2
    label_smoothing: 0.05
    
evaluation:
  partition: "test"
  batch_size: 32
  num_workers: 16
  use_signal_averaging: true
  grouped_samples: 100
  plot_results: true
  save_plots: true
  
submission:
  batch_size: 64
  num_workers: 32
  output_path: "<DATA_ROOT>/direct_baseline_experiment_082525v0_submission.csv"
  holdout_task: "phoneme"